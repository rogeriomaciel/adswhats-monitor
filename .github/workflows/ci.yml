  #       uses: oven-sh/setup-bun@v2
  #     - name: Deploy Workflows to Staging n8n
  #       run: bun run scripts/deploy_workflows_via_api.js
  #       env:
  #         N8N_API_KEY: ${{ secrets.STAGING_N8N_API_KEY }}
  #         N8N_HOST: ${{ secrets.STAGING_N8N_HOST }}

  deploy-production:
    name: Deploy to Production (Frontend & Workflows)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Application (Frontend)
        run: |
          if [ -f "package.json" ]; then
            bun run build
          fi
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_VERSION: 1.0.0

      - name: Deploy Frontend to VPS via SSH & Rsync
        if: env.SSH_HOST != ''
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvO --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}

      - name: Deploy Workflows to Production n8n
        run: bun run scripts/deploy_workflows_via_api.js
        env:
          N8N_API_KEY: ${{ secrets.PROD_N8N_API_KEY }}
          N8N_HOST: ${{ secrets.PROD_N8N_HOST }}
