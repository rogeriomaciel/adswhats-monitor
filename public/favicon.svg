    filter="url(#glow)"
  />

  <!-- Círculo Interno Suave de Profundidade -->
  <circle cx="32" cy="32" r="23" fill="#030712" fill-opacity="0.2" />

  <!-- Raio Dinâmico de Tráfego & Velocidade de Conversão (Ads -> Whats) -->
