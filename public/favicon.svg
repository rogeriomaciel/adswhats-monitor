<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="aw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Bubble com Glow e Gradiente de Alta Densidade -->
  <path
    d="M32 6C17.64 6 6 17.64 6 32c0 5.12 1.48 9.9 4.04 13.92L6.8 55.48a1.5 1.5 0 0 0 1.72 1.72l9.56-3.24C22.1 56.52 26.88 58 32 58c14.36 0 26-11.64 26-26S46.36 6 32 6z"
