# ==============================================================================
# Nginx VirtualHost — Frontend SPA (AdsWhats Monitor)
# Domínio: app.seudominio.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.seudominio.com;

    root /var/www/adswhatsmonitor;
    index index.html;

    client_max_body_size 50M;

    # Compressão Gzip para carregamento ultra-rápido do SPA
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache longo para assets estáticos com hash no nome (Vite)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)\$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Roteamento SPA: redireciona todas as rotas desconhecidas para o index.html do React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloqueio de arquivos ocultos
    location ~ /\.ht {
        deny all;
    }
}

