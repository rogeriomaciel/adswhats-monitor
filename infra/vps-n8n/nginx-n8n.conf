# ==============================================================================
# Nginx VirtualHost — n8n Gateway
# Domínio: n8nalvo.rogeriomaciel.com.br
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name n8nalvo.rogeriomaciel.com.br;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;

        # WebSockets e SSE (obrigatório para o editor de workflows e execuções em tempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Desativa o buffer para permitir streaming em tempo real das respostas do n8n
        proxy_buffering off;
        proxy_cache off;

        # Cabeçalhos
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos para execuções demoradas sem drop
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
        proxy_connect_timeout 300s;
    }

    # Bloqueio de arquivos ocultos
    location ~ /\.ht {
        deny all;
    }
}
