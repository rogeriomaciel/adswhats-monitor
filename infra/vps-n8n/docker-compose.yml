services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n_db}
      POSTGRES_USER: ${POSTGRES_USER:-n8n_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n_user} -d ${POSTGRES_DB:-n8n_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Exposto APENAS para localhost; o Nginx da VPS faz o proxy reverso seguro
      - "127.0.0.1:5678:5678"
    environment:
      # Configurações do Domínio e Webhooks
      N8N_HOST: ${N8N_HOST:-n8nalvo.rogeriomaciel.com.br}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: https://apiadswhats.alvoestrategia.com.br/
      N8N_ENDPOINT_WEBHOOK: app
      N8N_ENDPOINT_WEBHOOK_TEST: app_test
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

      # Permissões para nós de Código (JS Code nodes usar crypto, JWT, etc.)
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      N8N_RUNNERS_ENABLED: "true"
      N8N_PUSH_BACKEND: websocket

      # Otimizações de Memória e Processamento de Mídia
      NODE_OPTIONS: "--max-old-space-size=1024"
      EXECUTIONS_PROCESS: main
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_PAYLOAD_SIZE_MAX: "64"

      # Banco de Dados Local (PostgreSQL) — Impede travamentos de concorrência do SQLite
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n_db}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n_user}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n_secret_password}
      DB_POSTGRESDB_SCHEMA: public

      # Limpeza Automática de Execuções (Crucial para não lotar o disco)
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168" # Mantém 7 dias de histórico
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "50000"

      # Permissões e Segurança
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_network

volumes:
  postgres_data:
    name: n8n_postgres_data
  n8n_data:
    name: n8n_app_data

networks:
  n8n_network:
    name: n8n_network
    driver: bridge
