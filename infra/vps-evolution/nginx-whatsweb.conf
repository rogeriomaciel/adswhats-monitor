# ==============================================================================
# Nginx VirtualHost — Evolution API
# Domínio: whats.seudominio.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name whats.seudominio.com;

    # Limite de tamanho de upload (necessário para mídias: áudios, imagens, vídeos, PDFs)
    # Sem isso, arquivos acima de 1MB tomam erro HTTP 413 (Payload Too Large)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header HTTPS on;

        # Evita cache de status de instâncias e QR codes
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # Timeouts longos para manter conexões de WebSockets / SSE vivas sem queda
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 300s;

        # Cabeçalhos para WebSockets e identificação do cliente real
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloqueio de arquivos ocultos
    location ~ /\.ht {
        deny all;
    }
}
